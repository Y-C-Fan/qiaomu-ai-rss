name: Sync upstream
on:
  schedule: [{ cron: '0 2 * * 0' }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Merge upstream
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/joeseesun/qiaomu-ai-rss.git 2>/dev/null || true
          git fetch upstream
          if git merge --no-edit upstream/main; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Push clean merge
        if: steps.merge.outputs.merged == 'true'
        run: git push origin main
      - name: Open conflict PR
        if: steps.merge.outputs.merged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="sync/upstream-$(date +%Y%m%d)"
          git branch -f "$branch" upstream/main
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Sync upstream $(date +%Y-%m-%d)" \
            --body "Automatic sync with joeseesun/qiaomu-ai-rss hit conflicts. Review and resolve them in this PR."
